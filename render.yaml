services:
  - type: web
    name: localfix-app-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn localfix_mobile_api.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
